[project]
name = "hackathon-lipreading"
version = "0.1.0"
description = "Real time lipreading"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "marimo>=0.25.2",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "torch==2.5.1",
    "huggingface-hub>=2.2.0",
    "kenlm>=0.3.0",
    "streamlit>=1.66.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "streamlit-webrtc>=0.79.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true