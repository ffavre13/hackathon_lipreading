# Build the optimized and unoptimized images, and publish it when it reaches main.
#
# Two triggers, one file.
#   - a pull request BUILDS, to prove the image still assembles;
#   - a push to main BUILDS AND PUBLISHES, because that one is real.
name: cd

on:
  pull_request:
  push:
    # Both names, so this works whatever your default branch is called.
    branches: [main, master]
    tags:
      - "v*"

permissions:
  contents: write # need for creating new releases
  packages: write # without this the publish step fails with a 403

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # ghcr.io rejects uppercase, and GitHub usernames keep their case.
      - name: Work out the image name
        id: name
        run: |
          echo "leapreading_image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: github.ref_type  == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # On a pull request this is false: the image is built and thrown away.
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ steps.name.outputs.leapreading_image }}:latest
            ${{ steps.name.outputs.leapreading_image }}:${{ github.sha }}
            ${{ steps.name.outputs.leapreading_image }}:${{ github.ref_name }}
          # One line, two architectures. It is not free: the build gets slower.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create a release, but only when the workflow was triggered by a tag push
      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Docker images published to ghcr.io:
            - `${{ steps.name.outputs.leapreading_image }}:${{ github.ref_name }}`
